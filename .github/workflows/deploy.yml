name: Deploy InteractHub to AWS

on:
  push:
    branches: [ main ]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: |
          dotnet publish InteractHub.API/InteractHub.API.csproj \
            -c Release -r linux-x64 --self-contained true \
            -o ./publish-sc
          echo "web: ./InteractHub.API --urls http://0.0.0.0:5000" > ./publish-sc/Procfile

      - name: Zip artifact
        run: cd publish-sc && zip -r ../interacthub-api.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Upload to S3
        run: aws s3 cp interacthub-api.zip s3://interacthub-uploads/deploys/interacthub-api-${{ github.sha }}.zip

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name interacthub \
            --version-label ${{ github.sha }} \
            --source-bundle S3Bucket=interacthub-uploads,S3Key=deploys/interacthub-api-${{ github.sha }}.zip
          aws elasticbeanstalk update-environment \
            --environment-name interacthub-staging \
            --version-label ${{ github.sha }}

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build React
        run: |
          cd interacthub-client
          npm ci
          npm run build
        env:
          VITE_API_URL: http://interacthub-staging.eba-wgfffkes.ap-southeast-1.elasticbeanstalk.com/api

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Deploy frontend to S3
        run: aws s3 sync ./interacthub-client/dist s3://interacthub-frontend --delete